name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:workspace-deps
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -r build
      # Pack the SDK into a tarball, install it into a clean tmpdir,
      # and import it in plain Node ESM. Validates the PUBLISHED
      # artifact, not just source — catches extension bugs, exports-
      # map drift, and missing files in the tarball. See AGENTS.md →
      # "README-as-test-contract".
      - run: pnpm smoke
